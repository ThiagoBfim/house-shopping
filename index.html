<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1f6f5c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Monte a lista de compras de móveis e eletrodomésticos de cada cômodo dentro do seu orçamento."
    />
    <title>House Shopping</title>
    <!-- Prévia do link no WhatsApp e redes sociais (precisa de endereço absoluto). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="House Shopping" />
    <meta property="og:title" content="House Shopping — sua lista de compras por cômodo" />
    <meta
      property="og:description"
      content="Monte a lista de móveis e eletrodomésticos de cada cômodo dentro do seu orçamento."
    />
    <meta property="og:url" content="https://thiagobfim.github.io/house-shopping/" />
    <meta property="og:image" content="https://thiagobfim.github.io/house-shopping/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Ícone do House Shopping" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Tema escolhido (src/ui/theme.ts), aplicado antes de pintar para não piscar.
      try {
        const theme = localStorage.getItem('house-shopping:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
